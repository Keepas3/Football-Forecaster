# One entry per league. `csv_code` is the football-data.co.uk code used in
# historical season CSV filenames (https://www.football-data.co.uk/data.php),
# e.g. season 2023-24 English Premier League is "2324/E0.csv".
# `api_competition_id` is the football-data.org competition id used for
# live fixtures (see https://www.football-data.org/documentation/api).
# `flag_url` is a country flag image from flagcdn.com (static, never
# expires/rate-limits, unlike the API-sourced competition emblem).
# `zones` are 1-indexed table position ranges shown on the standings table:
# `kind` picks the marker ("qualify"=green, "playoff"=amber, "relegation"=red).
# All 4 domestic leagues below are top-flight divisions, so there's no
# promotion playoff (that's a second-tier thing, e.g. the EFL Championship
# playoffs -- it doesn't apply to the Premier League itself). Simplified
# deliberately: real Europa/Conference League qualification also depends on
# domestic cup winners and varies year to year, so only the stable Champions
# League and relegation bands are marked.
#
# Entry order here is the League picker's display order (dashboard/views/
# home.py and predictor.py both just do list(leagues.keys())) -- domestic
# leagues first (Premier League first), with the international/UN-flagged
# competitions grouped at the end.
leagues:
  - code: EPL
    name: English Premier League
    news_query: Premier League
    csv_code: E0
    api_competition_id: 2021
    seasons: ["1516", "1617", "1718", "1819", "1920", "2021", "2122", "2223", "2324", "2425", "2526", "2627"]
    flag_url: https://flagcdn.com/w40/gb-eng.png
    flag_emoji: "en"
    zones:
      - {start: 1, end: 4, kind: qualify, label: "Champions League"}
      - {start: 18, end: 20, kind: relegation, label: "Relegation"}
  - code: LALIGA
    name: La Liga
    csv_code: SP1
    api_competition_id: 2014
    seasons: ["1516", "1617", "1718", "1819", "1920", "2021", "2122", "2223", "2324", "2425", "2526", "2627"]
    flag_url: https://flagcdn.com/w40/es.png
    flag_emoji: "🇪🇸"
    zones:
      - {start: 1, end: 4, kind: qualify, label: "Champions League"}
      - {start: 18, end: 20, kind: relegation, label: "Relegation"}
  - code: BUNDESLIGA
    name: Bundesliga
    csv_code: D1
    api_competition_id: 2002
    seasons: ["1516", "1617", "1718", "1819", "1920", "2021", "2122", "2223", "2324", "2425", "2526", "2627"]
    flag_url: https://flagcdn.com/w40/de.png
    flag_emoji: "🇩🇪"
    zones:
      - {start: 1, end: 4, kind: qualify, label: "Champions League"}
      - {start: 16, end: 16, kind: playoff, label: "Relegation playoff"}
      - {start: 17, end: 18, kind: relegation, label: "Relegation"}
  - code: SERIEA
    name: Serie A
    csv_code: I1
    api_competition_id: 2019
    seasons: ["1516", "1617", "1718", "1819", "1920", "2021", "2122", "2223", "2324", "2425", "2526", "2627"]
    flag_url: https://flagcdn.com/w40/it.png
    flag_emoji: "🇮🇹"
    zones:
      - {start: 1, end: 4, kind: qualify, label: "Champions League"}
      - {start: 18, end: 20, kind: relegation, label: "Relegation"}
  - code: LIGUE1
    name: Ligue 1
    csv_code: F1
    api_competition_id: 2015
    seasons: ["1516", "1617", "1718", "1819", "1920", "2021", "2122", "2223", "2324", "2425", "2526", "2627"]
    flag_url: https://flagcdn.com/w40/fr.png
    flag_emoji: "🇫🇷"
    zones:
      - {start: 1, end: 3, kind: qualify, label: "Champions League"}
      - {start: 16, end: 16, kind: playoff, label: "Relegation playoff"}
      - {start: 17, end: 18, kind: relegation, label: "Relegation"}
  # No football-data.co.uk CSV exists for any competition in this group --
  # their match history/standings/squads come entirely from football-data.org's
  # live API (see ingest/fixtures.py's sync_results_to_db and
  # ingest/team_mapper.py's seed_teams_from_api). No csv_code means no
  # Dixon-Coles model either (League.supports_predictions is False) -- the
  # dashboard shows standings/fixtures/squads for these but skips score
  # predictions. Flagged with the UN flag rather than a country flag, since
  # none of them is a single nation's competition.
  - code: WC
    name: FIFA World Cup
    api_competition_id: 2000
    # Historical match + goal-scorer data (1930-2022) comes from a static
    # archive (see ingest/worldcup_archive.py -- jfjelstul/worldcup,
    # CC-BY-SA 4.0), not football-data.org: confirmed live that
    # football-data.org's free tier 403s on every historical WC season,
    # even the most recently concluded one. "2026"/"2030" (the
    # current/next tournament, no archive data yet) still go through the
    # existing football-data.org live-fixture path unchanged -- 2026 has no
    # zones since the group/knockout qualification math varies by
    # tournament format (48 teams from 2026 onward, top-2-per-group plus
    # best third-placed).
    data_source: archive_worldcup
    trainable: true
    has_groups: true
    seasons: ["1930", "1934", "1938", "1950", "1954", "1958", "1962", "1966", "1970", "1974", "1978", "1982", "1986", "1990", "1994", "1998", "2002", "2006", "2010", "2014", "2018", "2022", "2026", "2030"]
    season_display: single_year
    flag_url: https://flagcdn.com/w40/un.png
    flag_emoji: "🇺🇳"
  - code: UCL
    name: UEFA Champions League
    api_competition_id: 2001
    # Scoped to the 2024/25+ 36-team single league-phase table format --
    # older seasons used an 8-group format that a flat table can't represent
    # correctly, so they're deliberately left out.
    seasons: ["2425", "2526", "2627"]
    flag_url: https://flagcdn.com/w40/un.png
    flag_emoji: "🇺🇳"
    zones:
      - {start: 1, end: 8, kind: qualify, label: "Round of 16"}
      - {start: 9, end: 24, kind: playoff, label: "Knockout Playoff"}
      - {start: 25, end: 36, kind: relegation, label: "Eliminated"}
  - code: EURO
    name: European Championship
    news_query: UEFA European Championship
    api_competition_id: 2018
    # Historical match data (1960-2024) comes from a static archive (see
    # ingest/euro_archive.py -- openfootball/euro, CC0), same reasoning as
    # WC above. Goal-scorer detail from this source is genuinely
    # inconsistent tournament to tournament (confirmed live) -- shown where
    # it exists, nothing fabricated where it doesn't. "2028" (the next
    # tournament) still goes through the existing football-data.org
    # live-fixture path unchanged.
    data_source: archive_euro
    trainable: true
    has_groups: true
    seasons: ["1960", "1964", "1968", "1972", "1976", "1980", "1984", "1988", "1992", "1996", "2000", "2004", "2008", "2012", "2016", "2020", "2024", "2028"]
    season_display: single_year
    flag_url: https://flagcdn.com/w40/un.png
    flag_emoji: "🇺🇳"
  # football-data.org's free tier doesn't cover the Nations League, so --
  # like MLS below -- everything comes from ESPN's keyless endpoints
  # (slug uefa.nations, verified live: 54 teams, results back to the
  # 2018-19 edition). Editions are biennial and ESPN keys them by start
  # year, so season "2425" is ESPN `season=2024` and the odd years return
  # nothing. `has_groups` turns on the per-group standings tables: each
  # edition's groups (Group A1..D2) change every time, so the group is
  # stored per match (Match.group_name) rather than per team. No zones --
  # promotion/relegation between Leagues A-D follows rules that vary by
  # edition (same reasoning as the World Cup's missing zones).
  - code: NL
    name: UEFA Nations League
    news_query: UEFA Nations League
    data_source: espn
    espn_league_slug: uefa.nations
    trainable: true
    has_groups: true
    seasons: ["1819", "2021", "2223", "2425", "2627"]
    flag_url: https://flagcdn.com/w40/un.png
    flag_emoji: "🇺🇳"

  # football-data.org has zero MLS coverage at all (confirmed live: its
  # /v4/competitions list has 13 entries, none of them MLS) -- fixtures,
  # results, team seeding, squads, and injuries all come from ESPN's public,
  # keyless site.api.espn.com endpoints instead (see ingest/espn_client.py).
  # No api_competition_id (nothing to point it at) and no csv_code, but
  # unlike WC/UCL/EURO above this DOES get a trained Dixon-Coles model
  # (trainable: true) -- ESPN's per-team schedule endpoint gives genuine
  # multi-season history (verified live back to 2020), and the training
  # pipeline itself only ever reads generic `matches` table rows, so it
  # doesn't care that this history came from ESPN instead of a CSV.
  - code: MLS
    name: Major League Soccer
    data_source: espn
    espn_league_slug: usa.1
    trainable: true
    seasons: ["2020", "2021", "2022", "2023", "2024", "2025", "2026"]
    season_display: single_year
    flag_url: https://flagcdn.com/w40/us.png
    flag_emoji: "🇺🇸"
    # Real Concacaf Champions Cup qualification also includes the
    # Supporters' Shield winner, MLS Cup winner, and Leagues Cup winner --
    # trophy-based berths a static standings table can't represent. This
    # zone models just the table-position-based part (each conference's own
    # top regular-season finisher), which also always includes the
    # Supporters' Shield winner (the league's overall best record is
    # necessarily also the top of whichever conference it's in). Position 1
    # applies independently within EACH conference's own table (see
    # dashboard/views/home.py's per-conference standings split), not
    # position 1 overall.
    zones:
      - {start: 1, end: 1, kind: qualify, label: "Concacaf Champions Cup"}
