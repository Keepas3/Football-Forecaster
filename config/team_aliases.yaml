# Maps every team-name spelling we might see across data sources to one
# canonical name. `csv` = football-data.co.uk historical CSVs, `api` =
# football-data.org live API. `league` scopes each row to one league code
# from config/leagues.yaml -- ingest/team_mapper.py::seed_teams_and_aliases
# only processes rows matching the league it's currently seeding, so entries
# from different leagues never leak into each other even though they live in
# one flat file.
#
# EPL rows are seeded for clubs active in any of the 2021-22..2024-25
# seasons and confirmed clean (zero unresolved names on ingestion). The
# LALIGA/BUNDESLIGA/SERIEA rows are a good-faith first pass over the same
# season range -- non-English spellings are less certain than EPL's; check
# data/unmatched_teams.log after first ingesting each league and fix any
# rows here rather than guessing. Add new rows whenever a newly promoted or
# renamed club shows up unmatched.
