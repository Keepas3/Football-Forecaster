# Manual injury fallback list. Free injury APIs have weak/incomplete
# coverage, so this file is the reliable source the prediction service
# trusts most (see model/injury_adjustment.py and prediction/service.py,
# which merge this with any API data and let manual entries win).
#
# importance_weight is 0-1: how much the team relies on this player.
# position is "attack" or "defense" (defenders + goalkeeper); it decides
# which team rating (attack or defense) the injury pulls down.
#
# Don't have to guess importance_weight by hand: it's the same number
# ingest/player_importance.py::resolve_team_importance_weights computes
# from real goals/assists/xG/xA for that player (visible on Team Detail's
# squad list as the ⭐ star badge threshold, see dashboard/components.py)
# -- look it up there and paste it in.
#
# Example:
# injuries:
#   - team: Arsenal
#     player: Bukayo Saka
#     position: attack
#     importance_weight: 0.8
#     note: "Hamstring, out ~4 weeks (manual entry 2026-09-25)"

injuries: []
