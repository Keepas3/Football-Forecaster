[project]
name = "soccer-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Keepas3", email = "bfun679@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
]

[project.scripts]
soccer-predictor = "soccer_predictor:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
