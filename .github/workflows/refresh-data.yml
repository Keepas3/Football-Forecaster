name: Refresh data

on:
  schedule:
    - cron: "0 6 * * *" # 6am UTC daily
  workflow_dispatch: {} # manual "Run workflow" button, for on-demand testing

permissions:
  contents: write # needed to push the updated data/soccer.db back

concurrency:
  group: refresh-data
  cancel-in-progress: false # let an in-flight run finish rather than clobbering it

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # uv manages its own Python builds -- installs the version pinned
          # in .python-version even if the runner image doesn't have it yet.

      - run: uv sync --frozen

      - name: Refresh data and retrain
        env:
          FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
          # API_FOOTBALL_KEY deliberately omitted -- its free tier flagged
          # this workflow's rotating GitHub-runner IPs as suspicious and
          # suspended the account. refresh_live_data.py's injuries sync
          # already degrades gracefully (falls back to config/injuries.yaml
          # + chat notes) when this is unset, so this only drops the
          # API-sourced injuries step from the scheduled job -- Streamlit
          # Cloud's own secret and the local .env are untouched, so
          # "Load player stats" and defender/MLS star badges keep working
          # there once the suspension clears.
        run: |
          uv run python scripts/fetch_historical_data.py
          uv run python scripts/refresh_live_data.py
          uv run python scripts/run_training.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/soccer.db; then
            git add data/soccer.db
            git commit -m "Automated data refresh"
            git push
          else
            echo "No changes to data/soccer.db -- nothing to commit"
          fi
