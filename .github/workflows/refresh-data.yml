name: Refresh data

on:
  schedule:
    - cron: "0 6 * * *" # 6am UTC daily
  workflow_dispatch: {} # manual "Run workflow" button, for on-demand testing

permissions:
  contents: write # needed to push the updated data/soccer.db back

concurrency:
  group: refresh-data
  cancel-in-progress: false # let an in-flight run finish rather than clobbering it

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # uv manages its own Python builds -- installs the version pinned
          # in .python-version even if the runner image doesn't have it yet.

      - run: uv sync --frozen

      - name: Refresh data and retrain
        env:
          FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
          # No API_FOOTBALL_KEY -- that integration was removed entirely
          # (ingest/api_football_client.py, ingest/player_stats.py no
          # longer exist). Historical player stats now come from Understat
          # (5 European leagues) and American Soccer Analysis (MLS), both
          # keyless; UCL/EURO/World Cup have no stats source at all.
          #
          # football-data.org allows 10 requests a minute per key, shared with the deployed
          # dashboard. Stay under that with room to spare, and wait out a 429 instead of
          # failing the whole run (it did, 2026-11-08 to 2026-11-10: "429 Too Many Requests").
          FOOTBALL_DATA_MAX_REQUESTS_PER_MINUTE: "6"
          FOOTBALL_DATA_WAIT_OUT_RATE_LIMIT: "1"
        run: |
          uv run python scripts/fetch_historical_data.py
          uv run python scripts/refresh_live_data.py
          uv run python scripts/run_training.py
          # Keep the committed copy of Understat's current-season data fresh. It is what
          # rates a lineup (and feeds the Players page) while Understat is down: a runner
          # starts every job with no disk cache. A no-op if Understat did not answer today.
          uv run python scripts/save_understat_snapshot.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # status, not diff: the first snapshot of a new season is a new (untracked) file
          if [ -n "$(git status --porcelain -- data/soccer.db data/understat_snapshot)" ]; then
            git add data/soccer.db data/understat_snapshot
            git commit -m "Automated data refresh"
            git push
          else
            echo "No changes to data/soccer.db or data/understat_snapshot -- nothing to commit"
          fi
